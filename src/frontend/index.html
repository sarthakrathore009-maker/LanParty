<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LanParty Lobby</title>
    <!-- CSS file ko link kiya -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lobby-container">
        <h2>🎮 LanParty Lobby</h2>
        <hr>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="playerName" placeholder="Player Name">
            <input type="number" id="playerLevel" placeholder="Level">
            <button id="joinBtn">Join</button>
        </div>

        <!-- Lobby Status -->
        <h3>Players in Lobby: <span id="playerCount">0</span> / 4</h3>

        <!-- Khali list jahan JS data daalega -->
        <ul id="playersList">
            <p style="color: gray;" id="emptyMsg">Lobby is empty. Be the first to join!</p>
        </ul>
    </div>

    <!-- JavaScript file ko link kiya -->
    <script src="script.js"></script>
</body>
</html>
